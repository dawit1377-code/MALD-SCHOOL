<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        /* BRAND SETTINGS - Edit these to sell to a new school */
        :root {
            --school-name: "Fruits Academy";
            --primary-color: #2D5A27; /* Change for each school */
            --secondary-color: #F4D03F;
            --font-main: 'Segoe UI', sans-serif;
        }

        body { font-family: var(--font-main); margin: 0; background: #f4f7f4; }
        header { background: var(--primary-color); color: white; padding: 20px; text-align: center; border-bottom: 6px solid var(--secondary-color); }
        .nav { display: flex; justify-content: center; background: white; padding: 10px; gap: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav a { cursor: pointer; font-weight: bold; color: var(--primary-color); text-decoration: none; }
        .container { max-width: 900px; margin: 20px auto; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* ID CARD DESIGN */
        .id-card {
            width: 320px; height: 480px; border: 2px solid #ddd; border-radius: 15px;
            margin: 10px auto; padding: 20px; text-align: center; background: white;
            position: relative; overflow: hidden;
        }
        .id-card-header { background: var(--primary-color); color: white; margin: -20px -20px 20px -20px; padding: 15px; }
        .student-img { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--secondary-color); object-fit: cover; }
        .qr-canvas { margin-top: 15px; }
    </style>
</head>
<body>

<header>
    <h1 id="display-name">Fruits Academy</h1>
    <p>Official Student Management Portal</p>
</header>

<div class="nav">
    <a onclick="showPage('reg')">Registration</a>
    <a onclick="showPage('list')">Student List</a>
    <a onclick="showPage('id-gen')">Generate ID Cards</a>
</div>

<div class="container">
    <div id="page-reg" class="page">
        <div class="card">
            <h2>Student Enrollment</h2>
            <input type="text" id="name" placeholder="Full Name" style="width:100%; padding:10px; margin:5px 0;">
            <input type="text" id="grade" placeholder="Grade" style="width:48%; padding:10px;">
            <input type="text" id="section" placeholder="Section" style="width:48%; padding:10px;">
            <button onclick="saveStudent()" style="width:100%; background:var(--primary-color); color:white; padding:15px; border:none; margin-top:10px; border-radius:5px;">SUBMIT TO CLOUD</button>
        </div>
    </div>

    <div id="page-list" class="page" style="display:none;">
        <div class="card" id="student-container">
            <h2>Registry</h2>
            <div id="list-items">Loading students...</div>
        </div>
    </div>

    <div id="page-id-gen" class="page" style="display:none;">
        <div id="id-cards-output"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "YOUR_APPS_SCRIPT_URL";
    let allStudents = [];

    async function fetchStudents() {
        const res = await fetch(SCRIPT_URL);
        allStudents = await res.json();
        renderList();
        renderIDs();
    }

    function renderList() {
        document.getElementById('list-items').innerHTML = allStudents.map(s => `
            <div style="border-bottom:1px solid #eee; padding:10px;">
                <strong>${s.Name}</strong> - ${s.Grade} (${s.ID})
            </div>
        `).join('');
    }

    function renderIDs() {
        const output = document.getElementById('id-cards-output');
        output.innerHTML = allStudents.map(s => `
            <div class="id-card">
                <div class="id-card-header">
                    <h3>${document.getElementById('display-name').innerText}</h3>
                </div>
                <img src="${s.Student_Photo || 'https://via.placeholder.com/120'}" class="student-img">
                <h2>${s.Name}</h2>
                <p>ID: ${s.ID} | Grade: ${s.Grade}</p>
                <canvas id="qr-${s.ID}" class="qr-canvas"></canvas>
            </div>
        `).join('');

        // Generate the QR codes
        allStudents.forEach(s => {
            new QRious({
                element: document.getElementById(`qr-${s.ID}`),
                value: `Student: ${s.Name}\nID: ${s.ID}\nParent: ${s.Parent_Phone}`,
                size: 100
            });
        });
    }

    function showPage(p) {
        document.querySelectorAll('.page').forEach(el => el.style.display = 'none');
        document.getElementById('page-' + p).style.display = 'block';
        if(p !== 'reg') fetchStudents();
    }

    // Logic for saveStudent() would follow the same POST pattern as previous menus
</script>

</body>
</html>
